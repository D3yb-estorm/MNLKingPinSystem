<!DOCTYPE html>
<html>
<head>
    <title>🔧 Product Loading Test</title>
    <style>
        body { font-family: Arial; background: #222; color: #fff; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        .section { background: #333; padding: 20px; margin: 10px 0; border-radius: 5px; }
        button { background: #4caf50; color: white; padding: 10px 20px; border: none; border-radius: 3px; cursor: pointer; margin: 5px; }
        button:hover { background: #45a049; }
        .log { background: #1a1a1a; color: #4caf50; padding: 10px; border-radius: 3px; margin: 5px 0; font-family: monospace; max-height: 200px; overflow-y: auto; }
        .success { color: #4caf50; }
        .error { color: #f44336; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #555; }
        th { background: #444; font-weight: bold; }
        tr:hover { background: #3a3a3a; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 Product Loading Diagnostic Test</h1>
        
        <div class="section">
            <h2>1️⃣ Check localStorage</h2>
            <button onclick="checkStorage()">Check localStorage</button>
            <div id="storageLog" class="log"></div>
        </div>

        <div class="section">
            <h2>2️⃣ Load Products</h2>
            <button onclick="testLoadProducts()">Test Load Products</button>
            <button onclick="testInitSamples()">Test Initialize Samples</button>
            <button onclick="clearAllData()">CLEAR ALL DATA</button>
            <div id="loadLog" class="log"></div>
        </div>

        <div class="section">
            <h2>3️⃣ Display Test Data</h2>
            <div id="productTable"></div>
        </div>

        <div class="section">
            <h2>4️⃣ Test appData Object</h2>
            <button onclick="testAppData()">Test appData</button>
            <div id="appDataLog" class="log"></div>
        </div>
    </div>

    <script>
        const logs = {};

        function log(section, msg) {
            const logDiv = document.getElementById(section + 'Log');
            if (!logs[section]) logs[section] = [];
            logs[section].push(msg);
            logDiv.innerHTML = logs[section].map(m => `<div>${m}</div>`).join('');
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function checkStorage() {
            log('storage', '🔍 Checking localStorage...');
            
            // Check what's in localStorage
            const stored = localStorage.getItem('kingpinProducts');
            if (stored) {
                log('storage', '✅ Found kingpinProducts in localStorage');
                log('storage', `📊 Size: ${stored.length} bytes`);
                try {
                    const products = JSON.parse(stored);
                    log('storage', `<span class="success">✅ Parsed successfully: ${products.length} products</span>`);
                    products.forEach((p, i) => {
                        log('storage', `  ${i+1}. ${p.name} - ₱${p.price} (Stock: ${p.stock})`);
                    });
                } catch (e) {
                    log('storage', `<span class="error">❌ Parse error: ${e.message}</span>`);
                }
            } else {
                log('storage', '<span class="error">❌ No kingpinProducts found in localStorage</span>');
            }

            // Show all localStorage keys
            log('storage', '\n📋 All localStorage keys:');
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                const value = localStorage.getItem(key);
                log('storage', `  • ${key}: ${value.length} bytes`);
            }
        }

        function testLoadProducts() {
            log('load', '🚀 Testing product loading...');
            
            // First load storage
            log('load', '1. Loading from storage');
            const stored = localStorage.getItem('kingpinProducts');
            let products = [];
            
            if (stored) {
                try {
                    products = JSON.parse(stored);
                    log('load', `✅ Loaded ${products.length} products from storage`);
                } catch (e) {
                    log('load', `<span class="error">❌ Parse error: ${e}</span>`);
                }
            } else {
                log('load', '<span class="error">❌ No data in storage</span>');
            }

            // Display in table
            log('load', '2. Creating display table...');
            let html = '<table><tr><th>Name</th><th>Price</th><th>Stock</th></tr>';
            products.forEach(p => {
                html += `<tr>
                    <td>${p.name}</td>
                    <td>₱${p.price}</td>
                    <td>${p.stock}</td>
                </tr>`;
            });
            html += '</table>';
            document.getElementById('productTable').innerHTML = html;
            log('load', `<span class="success">✅ Table displayed with ${products.length} products</span>`);
        }

        function testInitSamples() {
            log('load', '🔨 Initializing sample products...');
            
            const samples = [
                { name: 'Basketball Jersey', type: 'basketball', price: 1299, stock: 50, image: 'images/basketball.jpg' },
                { name: 'Volleyball Jersey', type: 'volleyball', price: 1199, stock: 40, image: 'images/volleyball.jpg' },
                { name: 'Longsleeve Warmer', type: 'longsleeve', price: 1599, stock: 30, image: 'images/longsleeve.jpg' }
            ];

            localStorage.setItem('kingpinProducts', JSON.stringify(samples));
            log('load', `<span class="success">✅ Saved ${samples.length} sample products to localStorage</span>`);
            
            // Reload display
            setTimeout(() => testLoadProducts(), 100);
        }

        function clearAllData() {
            if (confirm('⚠️ Are you sure? This will delete ALL data!')) {
                localStorage.removeItem('kingpinProducts');
                logs = {};
                document.getElementById('storageLog').innerHTML = '';
                document.getElementById('loadLog').innerHTML = '';
                document.getElementById('appDataLog').innerHTML = '';
                document.getElementById('productTable').innerHTML = '';
                log('load', '<span class="success">✅ All data cleared</span>');
            }
        }

        function testAppData() {
            // Try to access appData from main app
            log('appData', '🔍 Testing appData object...');
            
            try {
                // Load main app script to get appData
                const script = document.createElement('script');
                script.src = 'js/app.js';
                script.onload = () => {
                    log('appData', '✅ app.js loaded');
                    if (typeof appData !== 'undefined') {
                        log('appData', `<span class="success">✅ appData exists</span>`);
                        log('appData', `  • appData.products: ${Array.isArray(appData.products) ? appData.products.length + ' items' : 'NOT AN ARRAY'}`);
                    } else {
                        log('appData', '<span class="error">❌ appData not defined</span>');
                    }
                };
                document.head.appendChild(script);
            } catch (e) {
                log('appData', `<span class="error">❌ Error: ${e.message}</span>`);
            }
        }

        // Auto-run on load
        window.onload = () => {
            log('storage', 'Page loaded. Run tests above ⬆️');
        };
    </script>
</body>
</html>

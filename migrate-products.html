<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>KingPin Product Migration</title>
</head>
<body style="font-family: sans-serif; padding: 24px;">
    <h2>KingPin Product Migration</h2>
    <p id="status">Checking saved Node products...</p>
    <script>
        (async function migrateProducts() {
            const status = document.getElementById('status');
            const stored = localStorage.getItem('kingpinProducts');
            const products = stored ? JSON.parse(stored) : [];

            if (!products.length) {
                status.textContent = 'No saved products were found in this browser tab.';
                return;
            }

            try {
                const response = await fetch('http://localhost/KingPinSystem/api/products.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ products })
                });
                if (!response.ok) throw new Error('Apache returned HTTP ' + response.status);
                status.textContent = 'Migrated ' + products.length + ' products and their photos to Apache. Open http://localhost/KingPinSystem/';
            } catch (error) {
                status.textContent = 'Migration failed: ' + error.message;
            }
        })();
    </script>
</body>
</html>

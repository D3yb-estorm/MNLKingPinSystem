<!DOCTYPE html>
<html>
<head>
    <title>Settings Tab Test</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            padding: 20px;
        }
        .test-container {
            background: #1a1a1a;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
        }
        .test-info {
            color: #d4af37;
            margin-bottom: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <div class="test-info">✓ CSS Styling Test for Settings Tab</div>
        
        <div class="admin-container">
            <div id="settingsTab" class="admin-tab" style="display: block;">
                <h2>Admin Settings</h2>
                
                <div class="settings-section">
                    <h3>🎨 Shop Logo & Branding</h3>
                    <form id="logoUploadForm">
                        <div class="form-group">
                            <label for="shopLogoFile">Upload Logo Image:</label>
                            <input type="file" id="shopLogoFile" accept="image/*" required>
                            <small>Supported formats: JPG, PNG, GIF</small>
                        </div>
                        
                        <div class="form-group">
                            <label for="shopLogoName">Shop Name:</label>
                            <input type="text" id="shopLogoName" placeholder="Enter your shop name" value="KingPin Custom Ph® CamSur" required>
                        </div>
                        
                        <button type="submit" class="btn btn-primary">Update Logo & Name</button>
                    </form>
                    <div id="logoMessage" class="message"></div>
                </div>
                
                <div class="settings-section">
                    <h3>Change Admin Credentials</h3>
                    <form id="credentialsForm">
                        <div class="form-group">
                            <label for="currentPassword">Current Password:</label>
                            <input type="password" id="currentPassword" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="newUsername">New Username:</label>
                            <input type="text" id="newUsername" required>
                            <small>Leave blank to keep current username</small>
                        </div>
                        
                        <div class="form-group">
                            <label for="newPassword">New Password:</label>
                            <input type="password" id="newPassword" required>
                            <small>Minimum 6 characters</small>
                        </div>
                        
                        <div class="form-group">
                            <label for="confirmPassword">Confirm New Password:</label>
                            <input type="password" id="confirmPassword" required>
                        </div>
                        
                        <button type="submit" class="btn btn-primary">Update Credentials</button>
                    </form>
                    <div id="credentialsMessage" class="message"></div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="test-container">
        <div class="test-info">✓ If you see two form sections above with input fields, styling is correct!</div>
    </div>
</body>
</html>
